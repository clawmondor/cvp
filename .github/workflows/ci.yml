name: ci

on:
  push:
    branches: [main, cvp-legacy]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - name: Install deps
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - name: Install deps
        run: uv sync --frozen
      - name: System libs for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libffi8 fonts-liberation
      - name: Run pytest
        run: uv run pytest

  secrets:
    name: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  containers:
    name: containers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [custom-python]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build \
            -f cloudflare/images/${{ matrix.image }}/Dockerfile \
            --build-arg IMAGE_TAG=${{ github.sha }} \
            -t cvp-agent-${{ matrix.image }}:${{ github.sha }} .
      # PRs build only. Pushing on every review round would consume the
      # 50 GB per-account registry budget, which has no automatic GC.
      - name: Push to Cloudflare registry
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler containers push \
            cvp-agent-${{ matrix.image }}:${{ github.sha }}
