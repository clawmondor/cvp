name: ci

on:
  push:
    branches: [main, cvp-legacy]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - name: Install deps
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - name: Install deps
        run: uv sync --frozen
      - name: System libs for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libffi8 fonts-liberation
      - name: Run pytest
        run: uv run pytest

  secrets:
    name: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  worker:
    name: worker-typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Type-check the Worker
        run: npx tsc --noEmit

  containers:
    name: containers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [custom-python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Built from the repository root: the Dockerfile's COPY lines are
      # root-relative (it needs both cloudflare/images/shared/ and
      # skills/airecommendations/scripts/agent_client.py).
      - name: Build image
        run: |
          docker build \
            -f cloudflare/images/${{ matrix.image }}/Dockerfile \
            --build-arg IMAGE_TAG=${{ github.sha }} \
            -t cvp-agent-${{ matrix.image }}:${{ github.sha }} .
      # PRs build only. Pushing on every review round would consume the
      # 50 GB per-account registry budget, which has no automatic GC.
      #
      # The push runs from cloudflare/ so wrangler finds wrangler.toml for
      # account context, and the image is re-tagged to the fully-qualified
      # managed-registry reference first — a bare local tag is rejected.
      - name: Push to Cloudflare registry
        if: github.event_name == 'push'
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          LOCAL="cvp-agent-${{ matrix.image }}:${{ github.sha }}"
          REF="registry.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/${LOCAL}"
          docker tag "$LOCAL" "$REF"
          npm ci --no-audit --no-fund
          npx wrangler containers push "$REF"
